services:
  app:
    build: .
    image: dan1993/api-ediarista:latest
    ports:
      - "3000:3000"   # ou "8000:8000" se sua app escuta 8000
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ediarista
      # PORT: 3000     # defina se seu main.ts lê process.env.PORT
    depends_on:
      - db
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ediarista
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
